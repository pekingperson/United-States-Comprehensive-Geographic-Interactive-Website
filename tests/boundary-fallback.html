<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Census boundary fallback regression check</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.2.1/ol.css">
    <style>
      body { margin: 0; font: 16px sans-serif; }
      header { padding: 12px; }
      #map { height: 65vh; background: #eee; }
      #result { padding: 12px; }
    </style>
  </head>
  <body>
    <header>
      <strong>Census fallback test: primary tiles deliberately return 404</strong>
      <label>City
        <select id="city"><option>Seattle</option><option>Bay Area</option><option>Dallas</option></select>
      </label>
      <label>Boundary type
        <select id="boundary-type">
          <option value="140">Tracts (ancestry)</option><option value="050">Counties</option>
          <option value="160">Places and CDPs</option><option value="310">Metro and micro areas</option>
          <option value="860">ZIP codes</option><option value="150">Block groups</option>
          <option value="040">States</option><option value="010">Nation</option>
        </select>
      </label>
    </header>
    <div id="map"></div>
    <output id="result" aria-live="polite">Loading ancestry data...</output>
    <script src="https://cdn.jsdelivr.net/npm/ol@10.2.1/dist/ol.js"></script>
    <script src="../assets/census-boundary-source.js"></script>
    <script>
      const cities = { Seattle: [-122.33, 47.61], "Bay Area": [-122.04, 37.60], Dallas: [-96.80, 32.78] };
      const result = document.querySelector("#result");
      function fallbackSource(sumlevel) {
        const source = CensusBoundarySource.createSource(ol, { sumlevel, url: `./deliberately-missing-tile/${sumlevel}/{z}/{x}/{y}.mvt` });
        source.on("tileloadend", (event) => {
          if (source !== layer.getSource()) return;
          loaded += 1;
          matched += event.tile.getFeatures().filter((feature) => sumlevel !== "140" || data?.tracts[Number(feature.get("GEOID"))]).length;
          report();
        });
        source.on("tileloaderror", () => { if (source === layer.getSource()) { failures += 1; report(); } });
        return source;
      }
      let data;
      let loaded = 0;
      let failures = 0;
      let matched = 0;
      function report() { result.textContent = `${loaded} fallback tiles loaded; ${failures} failed; ${matched} matching tract features.`; }
      const styles = new Map();
      const boundaryStyle = new ol.style.Style({ fill: new ol.style.Fill({ color: "#00a3ff30" }), stroke: new ol.style.Stroke({ color: "#005a8d", width: 2 }) });
      const layer = new ol.layer.VectorTile({
        source: fallbackSource("140"), renderMode: "vector", updateWhileAnimating: true,
        style(feature) {
          if (document.querySelector("#boundary-type").value !== "140") return boundaryStyle;
          const row = data?.tracts[Number(feature.get("GEOID"))];
          const identity = row && data.identities.find((entry) => entry.id === row[0]);
          if (!identity) return undefined;
          if (!styles.has(identity.color)) styles.set(identity.color, new ol.style.Style({
            fill: new ol.style.Fill({ color: identity.color }),
            stroke: new ol.style.Stroke({ color: "#fff", width: 0.5 })
          }));
          return styles.get(identity.color);
        }
      });
      const map = new ol.Map({ target: "map", layers: [layer], view: new ol.View({ center: ol.proj.fromLonLat(cities.Seattle), zoom: 12 }) });
      document.querySelector("#boundary-type").addEventListener("change", (event) => {
        loaded = failures = matched = 0;
        layer.setSource(fallbackSource(event.target.value));
        report();
      });
      document.querySelector("#city").addEventListener("change", (event) => map.getView().setCenter(ol.proj.fromLonLat(cities[event.target.value])));
      fetch("../data/ancestry-tracts.json").then((response) => response.json()).then((payload) => {
        data = payload;
        layer.changed();
        report();
      }).catch((error) => { result.textContent = error.message; });
    </script>
  </body>
</html>
